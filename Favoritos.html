<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Favoritos - Plataforma Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800">

  <!-- HEADER -->
  <header class="bg-green-400 text-white">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
      <div class="font-semibold text-lg">📘 Plataforma Digital</div>
      <nav class="space-x-6 text-sm">
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="favoritos.html" class="underline font-semibold">Favoritos</a>
        <a href="contacto.html">Contacto</a>
        <a href="acerca.html">Acerca de</a>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO -->
  <section class="max-w-6xl mx-auto py-16 px-6">
    <h1 class="text-3xl font-bold mb-8 text-center">⭐ Mis Favoritos</h1>

    <div id="contenedorFavoritos" class="grid md:grid-cols-3 gap-6"></div>

    <p id="vacio" class="text-center text-gray-500 mt-6"></p>
  </section>

  <!-- FOOTER -->
  <footer class="bg-green-400 text-white mt-20 text-center py-6">
    © Plataforma Digital
  </footer>

  <!-- SCRIPT -->
  <script>
    const contenedor = document.getElementById("contenedorFavoritos");
    const vacio = document.getElementById("vacio");

    function mostrarFavoritos() {
      const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

      contenedor.innerHTML = "";

      if (favoritos.length === 0) {
        vacio.textContent = "No tienes servicios en favoritos";
        return;
      }

      vacio.textContent = "";

      favoritos.forEach(servicio => {
        contenedor.innerHTML += `
          <div class="bg-white shadow rounded-lg p-5">
            <h2 class="font-semibold text-lg mb-2">
              ${servicio.nombre}
            </h2>

            <p class="text-gray-500 mb-4">
              ${servicio.descripcion || ""}
            </p>

            <button onclick="eliminarFavorito(${servicio.id})"
              class="bg-red-400 text-white px-4 py-2 rounded hover:bg-red-500">
              Eliminar
            </button>
          </div>
        `;
      });
    }

    function eliminarFavorito(id) {
      let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
      favoritos = favoritos.filter(f => f.id !== id);
      localStorage.setItem("favoritos", JSON.stringify(favoritos));
      mostrarFavoritos();
    }

    mostrarFavoritos();
  </script>

</body>
</html>
