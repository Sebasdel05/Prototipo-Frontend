<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Digital — Detalle del Servicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .breadcrumb {
            background: white;
            padding: .9rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: .85rem;
            color: var(--light);
        }

        .breadcrumb a {
            color: var(--primary);
        }

        .breadcrumb span {
            margin: 0 .4rem;
        }

        .detail-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
            padding: 4rem 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .detail-img {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .detail-img img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .detail-tag {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            background: var(--grad);
            color: white;
            font-size: .78rem;
            font-weight: 700;
            padding: .35rem .9rem;
            border-radius: 50px;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .detail-info h1 {
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            color: var(--dark);
        }

        .detail-subtitle {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
        }

        .detail-desc {
            color: var(--light);
            line-height: 1.8;
            font-size: .95rem;
        }

        .features-list {
            display: flex;
            flex-direction: column;
            gap: .7rem;
        }

        .features-list h3 {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: .3rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: .75rem;
            font-size: .9rem;
            color: var(--mid);
        }

        .feature-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--grad);
            flex-shrink: 0;
        }

        .detail-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: .5rem;
        }

        /* Por qué elegirnos */
        .why-section {
            background: white;
            padding: 4rem 1.5rem;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .why-card {
            text-align: center;
            padding: 1.8rem 1.2rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .why-icon {
            font-size: 2rem;
            margin-bottom: .75rem;
        }

        .why-title {
            font-family: 'Lora', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: .4rem;
        }

        .why-desc {
            font-size: .82rem;
            color: var(--light);
        }

        #notFound {
            text-align: center;
            padding: 6rem 1.5rem;
        }

        #notFound h2 {
            color: var(--dark);
            margin-bottom: 1rem;
        }

        @media(max-width:900px) {
            .detail-hero {
                grid-template-columns: 1fr;
            }

            .why-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width:640px) {
            .why-grid {
                grid-template-columns: 1fr;
            }

            .detail-img img {
                height: 260px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="breadcrumb container">
        <a href="index.html">Inicio</a><span>›</span>
        <a href="servicios.html">Servicios</a><span>›</span>
        <span id="breadTitle">Detalle</span>
    </div>

    <div id="detalleContent"></div>

    <div id="notFound" style="display:none">
        <h2>Servicio no encontrado</h2>
        <p>El servicio que buscas no existe o fue eliminado.</p>
        <a href="servicios.html" class="btn btn-primary" style="margin-top:1.5rem;display:inline-flex;">← Volver al
            catálogo</a>
    </div>

    <div id="footer"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/detalle.js"></script>
</body>

</html>
